name: Convert ready project drafts to issues

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: convert-project-drafts
  cancel-in-progress: false

env:
  PROJECT_OWNER: FamiliyOG
  TARGET_REPOSITORY: FamiliyOG/Babycharts
  STATUS_FIELD_NAME: Status
  READY_STATUS: '🎯 Ready'
  IN_PROGRESS_STATUS: '🚧 In Progress'
  DEFAULT_ASSIGNEE: Zonk1987

jobs:
  convert-drafts:
    name: Convert Draft Issues
    runs-on: ubuntu-latest

    steps:
      - name: Validate configuration
        env:
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_NUMBER}" ]]; then
            echo "::error::Repository variable PROJECT_NUMBER is not configured."
            exit 1
          fi

          if [[ -z "${PROJECT_TOKEN}" ]]; then
            echo "::error::Repository secret PROJECT_TOKEN is not configured."
            exit 1
          fi

      - name: Convert drafts with Ready for Issue status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${PROJECT_OWNER}"
          REPO_FULL="${TARGET_REPOSITORY}"
          REPO_OWNER="${REPO_FULL%%/*}"
          REPO_NAME="${REPO_FULL#*/}"

          REPOSITORY_ID="$(
            gh api graphql \
              -f owner="${REPO_OWNER}" \
              -f name="${REPO_NAME}" \
              -f query='
                query($owner:String!, $name:String!) {
                  repository(owner:$owner, name:$name) {
                    id
                  }
                }
              ' \
              --jq '.data.repository.id'
          )"

          PROJECT_INFO="$(
            gh api graphql \
              -F number="${PROJECT_NUMBER}" \
              -f login="${OWNER}" \
              -f query='
                query($login:String!, $number:Int!) {
                  organization(login:$login) {
                    projectV2(number:$number) {
                      id
                      fields(first:50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              '
          )"

          PROJECT_ID="$(jq -r '.data.organization.projectV2.id' <<<"${PROJECT_INFO}")"
          STATUS_FIELD_ID="$(
            jq -r \
              --arg field "${STATUS_FIELD_NAME}" \
              '.data.organization.projectV2.fields.nodes[] | select(.name == $field) | .id' \
              <<<"${PROJECT_INFO}"
          )"
          IN_PROGRESS_OPTION_ID="$(
            jq -r \
              --arg field "${STATUS_FIELD_NAME}" \
              --arg option "${IN_PROGRESS_STATUS}" \
              '.data.organization.projectV2.fields.nodes[] | select(.name == $field) | .options[] | select(.name == $option) | .id' \
              <<<"${PROJECT_INFO}"
          )"

          AFTER=""
          converted=0

          while true; do

            if [[ -z "${AFTER}" ]]; then
              RESPONSE="$(
                gh api graphql \
                  -F number="${PROJECT_NUMBER}" \
                  -f login="${OWNER}" \
                  -f query='
                    query($login:String!, $number:Int!) {
                      organization(login:$login) {
                        projectV2(number:$number) {
                          title
                          items(first:100) {
                            nodes {
                              id
                              content {
                                __typename
                                ... on DraftIssue {
                                  title
                                }
                              }
                              fieldValues(first:50) {
                                nodes {
                                  __typename
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                    field {
                                      ... on ProjectV2SingleSelectField {
                                        name
                                      }
                                    }
                                  }
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }
                  '
              )"
            else
              RESPONSE="$(
                gh api graphql \
                  -F number="${PROJECT_NUMBER}" \
                  -f login="${OWNER}" \
                  -f after="${AFTER}" \
                  -f query='
                    query($login:String!, $number:Int!, $after:String!) {
                      organization(login:$login) {
                        projectV2(number:$number) {
                          title
                          items(first:100, after:$after) {
                            nodes {
                              id
                              content {
                                __typename
                                ... on DraftIssue {
                                  title
                                }
                              }
                              fieldValues(first:50) {
                                nodes {
                                  __typename
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    name
                                    field {
                                      ... on ProjectV2SingleSelectField {
                                        name
                                      }
                                    }
                                  }
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }
                  '
              )"
            fi

            mapfile -t ITEMS < <(
              jq -r \
                --arg field "${STATUS_FIELD_NAME}" \
                --arg status "${READY_STATUS}" '
                  .data.organization.projectV2.items.nodes[]
                  | select(.content.__typename == "DraftIssue")
                  | select(
                      any(
                        .fieldValues.nodes[]?;
                        .__typename == "ProjectV2ItemFieldSingleSelectValue"
                        and .field.name == $field
                        and .name == $status
                      )
                    )
                  | [.id, (.content.title // "Untitled draft")]
                  | @tsv
                ' <<<"${RESPONSE}"
            )

            for ITEM in "${ITEMS[@]}"; do
              ITEM_ID="${ITEM%%$'\t'*}"
              TITLE="${ITEM#*$'\t'}"

              echo "Converting: ${TITLE}"

              CONVERT_RESULT="$(
                gh api graphql \
                  -f itemId="${ITEM_ID}" \
                  -f repositoryId="${REPOSITORY_ID}" \
                  -f query='
                    mutation($itemId:ID!, $repositoryId:ID!) {
                      convertProjectV2DraftIssueItemToIssue(
                        input: {
                          itemId: $itemId
                          repositoryId: $repositoryId
                        }
                      ) {
                        item {
                          id
                          content {
                            ... on Issue {
                              number
                              title
                              url
                            }
                          }
                        }
                      }
                    }
                  '
              )"

              NEW_ITEM_ID="$(jq -r '.data.convertProjectV2DraftIssueItemToIssue.item.id // empty' <<<"${CONVERT_RESULT}")"
              ISSUE_NUMBER="$(jq -r '.data.convertProjectV2DraftIssueItemToIssue.item.content.number // empty' <<<"${CONVERT_RESULT}")"
              ISSUE_TITLE="$(jq -r '.data.convertProjectV2DraftIssueItemToIssue.item.content.title // empty' <<<"${CONVERT_RESULT}")"
              ISSUE_URL="$(jq -r '.data.convertProjectV2DraftIssueItemToIssue.item.content.url // empty' <<<"${CONVERT_RESULT}")"

              echo "Created issue #${ISSUE_NUMBER}: ${ISSUE_TITLE} — ${ISSUE_URL}"

              if [[ -n "${DEFAULT_ASSIGNEE:-}" && -n "${ISSUE_NUMBER}" ]]; then
                echo "Assigning issue #${ISSUE_NUMBER} to ${DEFAULT_ASSIGNEE}..."
                gh issue edit "${ISSUE_NUMBER}" \
                  --repo "${REPO_FULL}" \
                  --add-assignee "${DEFAULT_ASSIGNEE}" || true
              fi

              if [[ -n "${NEW_ITEM_ID:-}" && -n "${PROJECT_ID:-}" && -n "${STATUS_FIELD_ID:-}" && -n "${IN_PROGRESS_OPTION_ID:-}" ]]; then
                echo "Moving project item to '${IN_PROGRESS_STATUS}'..."
                gh api graphql \
                  -f projectId="${PROJECT_ID}" \
                  -f itemId="${NEW_ITEM_ID}" \
                  -f fieldId="${STATUS_FIELD_ID}" \
                  -f optionId="${IN_PROGRESS_OPTION_ID}" \
                  -f query='
                    mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: {
                            singleSelectOptionId: $optionId
                          }
                        }
                      ) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  ' >/dev/null || true
              fi

              converted=$((converted + 1))
            done

            HAS_NEXT="$(
              jq -r \
                '.data.organization.projectV2.items.pageInfo.hasNextPage' \
                <<<"${RESPONSE}"
            )"

            AFTER="$(
              jq -r \
                '.data.organization.projectV2.items.pageInfo.endCursor // empty' \
                <<<"${RESPONSE}"
            )"

            if [[ "${HAS_NEXT}" != "true" ]]; then
              break
            fi

          done

          echo "Converted ${converted} Draft Issue(s)."
