# SonarQube / SonarCloud Configuration
sonar.sonarQubeUri=https://sonarcloud.io
sonar.organization=FamilyOG
sonar.projectKey=FamilyOG_Babycharts
sonar.projectName=Babycharts
sonar.sources=src,server
sonar.tests=src/test,e2e
sonar.test.inclusions=src/test/**/*.js,src/test/**/*.jsx,e2e/**/*.js
sonar.exclusions=**/dist/**,**/coverage/**,**/reports/**,**/node_modules/**,**/server/data/**,**/.github/**,**/*.yml,**/*.yaml,src/data/demoProfiles.js,src/data/whoPercentiles.js
sonar.cpd.exclusions=src/test/**/*,src/test/**/*.js,src/test/**/*.jsx,e2e/**/*,e2e/**/*.js,src/data/demoProfiles.js,src/data/whoPercentiles.js,**/src/test/**,**/e2e/**,**/src/data/demoProfiles.js,**/coverage/**,**/reports/**
sonar.javascript.environments=browser,nodejs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
