# axe Accessibility Linter Configuration
# https://docs.deque.com/devtools-for-web/4/en/axe-linter-config

tags:
  - wcag2a
  - wcag2aa
  - wcag2aaa
  - wcag21a
  - wcag21aa
  - wcag21aaa
  - wcag22aa
  - wcag22aaa
  - best-practice

rules:
  color-contrast: true
  color-contrast-enhanced: true
  heading-order: true

exclude:
  - 'coverage/**'
  - '**/coverage/**'
  - 'reports/**'
  - '**/reports/**'
  - 'dist/**'
  - '**/dist/**'
  - 'playwright-report/**'
  - '**/playwright-report/**'
  - 'test-results/**'
  - '**/test-results/**'
  - 'node_modules/**'
