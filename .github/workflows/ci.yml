name: CI & Code Quality

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.agents/**'
      - '.github/workflows/deploy-unraid.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.agents/**'
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC (runs Node 22 compatibility check)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Format & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'schedule' && fromJSON('["22.x", "24.x"]') || fromJSON('["24.x"]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Code Quality & Architecture Audit (Format, Lint, Deadcode, Duplicates, Arch)
        run: npm run scan:code

      - name: Run Automated Tests & Coverage (Vitest & Supertest)
        run: npm run scan:test

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build

      - name: SonarCloud Scan
        if: matrix.node-version == '24.x' && secrets.SONAR_TOKEN != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
